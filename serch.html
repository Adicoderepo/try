<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Student Data</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #e9ecef;
            font-family: Arial, sans-serif;
        }
        .container {
            width: 320px;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,.15);
        }
        h2 { text-align: center; color: #333; }
        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        /* Piche se automatic aane wale name box ko alag dikhane ke liye */
        #resultName {
            background: #f8f9fa;
            font-weight: bold;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            font-size: 16px;
            margin-top: 5px;
        }
        .nav-btn {
            background: #007bff;
            margin-bottom: 15px;
        }
        /* Photo ka Bada Box */
        .image-box {
            width: 100%;
            height: 220px;
            border: 2px dashed #bbb;
            margin-top: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fafafa;
            border-radius: 5px;
            overflow: hidden;
        }
        .image-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: none; /* Pehle hidden rahegi */
        }
        .placeholder-text {
            color: #888;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Wapas Form Page par jaane ka button -->
        <button class="nav-btn" onclick="window.location.href='index.html'">⬅️ Go to Form Page</button>

        <h2>Search Student</h2>
        
        <!-- Input 1: Search karne ke liye Mobile Number -->
        <input id="searchMobile" type="text"class="searchUser" placeholder="Enter Mobile Number to Search">
        
        <button id="searchBtn">Search</button>

        <!-- Input 2: Isme automatic user ka name dikhega -->
        <input id="resultName" type="text" placeholder="Student Name (Auto-fetched)" readonly>

        <!-- Big Photo Box -->
        <div class="image-box">
            <span id="placeholderText" class="placeholder-text">No Photo Loaded</span>
            <img id="studentPhoto" src="" alt="Student Photo">
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const SUPABASE_URL = "https://gzitfihztwmvxsotihyl.supabase.co";
            const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd6aXRmaWh6dHdtdnhzb3RpaHlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczOTExNzUsImV4cCI6MjEwMjk2NzE3NX0.2jZCMxCC3B-rAE-FeRujPIC5FRf_g2aaHWCVFyNQwBc";
            
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

            document.getElementById("searchBtn").addEventListener("click", searchUser);

            async function searchUser() {
                const mobileInput = document.getElementById("searchMobile").value.trim();
                const nameBox = document.getElementById("resultName");
                const imgTag = document.getElementById("studentPhoto");
                const placeholder = document.getElementById("placeholderText");

                // Clear previous results
                nameBox.value = "";
                imgTag.style.display = "none";
                placeholder.style.display = "block";
                placeholder.innerText = "Searching...";

                if (mobileInput === "") {
                    alert("⚠️ Kripya Mobile Number enter karein.");
                    placeholder.innerText = "No Photo Loaded";
                    return;
                }

                try {
                    // Supabase database se mobile number ke basis par fetch karna
                    const { data, error } = await supabase
                        .from("try")
                        .select("name, url")
                        .eq("mobile", mobileInput)
                        .single(); // Hame sirf ek hi matching record chahiye

                    if (error || !data) {
                        alert("❌ No record found with this Mobile Number!");
                        placeholder.innerText = "No Data Found";
                        return;
                    }

                    // Data milne par Input Box aur Image Box me data load karna
                    nameBox.value = data.name; // Name display hona

                    if (data.url) {
                        imgTag.src = data.url;
                        imgTag.style.display = "block"; // Image dikhana
                        placeholder.style.display = "none"; // Text hatana
                    } else {
                        placeholder.innerText = "Photo URL not available";
                    }

                } catch (err) {
                    console.error(err);
                    alert("❌ Connection Error!");
                    placeholder.innerText = "Error Loading Image";
                }
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
    <head>
    <meta charset="UTF-8">
        <meta name ="viewport" content="width=device-width,initial-scale=1.0">

    <body>
        <style>
            body{
            margin:0px;
            padding: 0;
            display: flex;
            flex-direction: column; /* Inputs ko neeche ek lane ke liye */
            justify-content: center;/* Vertically (up-down) center karne ke liye */
            align-items: center;    /* Horizontally (left-right) center karne ke liye */
            min-height: 100vh;      /* Poori screen ki height lene ke liye */
            background-color: #f4f4f4; 
        }
        .input-box{
            background-color: lightblue;
            height:20px;
            border-radius: 5px;
        }
        .button-click{
            background-color: red;
            color:white;
            width: 40px;
            height:30px;
            gap:10px;
            margin-top:15px;;
        }
        </style>
        <input type ="text" class="input-box" placeholder="name"><br>
        <input type ="text"  class="input-box" placeholder="mobile no">
        <button type="button"class="button-click"> save</button>
    
    </body>

</html>

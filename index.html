<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase Save Data</title>

    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body{
            margin:0;
            padding:0;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            background:#f4f4f4;
            font-family:Arial,sans-serif;
        }

        .container{
            background:white;
            padding:25px;
            border-radius:12px;
            box-shadow:0 0 10px rgba(0,0,0,.2);
            width:300px;
            text-align:center;
        }

        h2{
            margin-bottom:20px;
        }

        .input-box{
            width:100%;
            padding:10px;
            margin-bottom:15px;
            border:1px solid #999;
            border-radius:6px;
            font-size:16px;
            box-sizing:border-box;
        }

        .button-click{
            width:100%;
            padding:10px;
            background:red;
            color:white;
            border:none;
            border-radius:6px;
            cursor:pointer;
            font-size:16px;
        }

        .button-click:hover{
            background:darkred;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Student Form</h2>

    <input type="text" id="name" class="input-box" placeholder="Enter Name">

    <input type="text" id="mobile" class="input-box" placeholder="Enter Mobile Number">

    <button id="saveBtn" class="button-click">Save</button>

</div>

<script>

const SUPABASE_URL = "https://gzitfihztwmvxsotihyl.supabase.co";

/* 👇 यहाँ अपनी Publishable (Anon) Key पेस्ट करो */
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd6aXRmaWh6dHdtdnhzb3RpaHlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczOTExNzUsImV4cCI6MjEwMjk2NzE3NX0.2jZCMxCC3B-rAE-FeRujPIC5FRf_g2aaHWCVFyNQwBc";

const supabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

// Save Button
document.getElementById("saveBtn").addEventListener("click", saveData);

async function saveData(){

    const name = document.getElementById("name").value.trim();
    const mobile = document.getElementById("mobile").value.trim();

    // Validation
    if(name === "" || mobile === ""){
        alert("⚠️ Name aur Mobile Number bharo.");
        return;
    }

    if(!/^[0-9]{10}$/.test(mobile)){
        alert("⚠️ Mobile Number 10 digit ka hona chahiye.");
        return;
    }

    // Data Save
    const { error } = await supabase
        .from("students")
        .insert([
            {
                name: name,
                mobile: mobile
            }
        ]);

    if(error){
        console.log(error);
        alert("❌ Data Save Nahi Hua!");
    }else{
        alert("✅ Data Successfully Save Ho Gaya!");

        document.getElementById("name").value = "";
        document.getElementById("mobile").value = "";
        document.getElementById("name").focus();
    }

}

</script>

</body>
</html>
